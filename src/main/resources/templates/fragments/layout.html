<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <body>
        <!-- ========================================
             共通ヘッダー
             ======================================== -->
        <header class="header" th:fragment="header">
            <!-- アプリケーション名 -->
            <div class="header-logo">CareerTrack</div>

            <!-- ログインユーザー情報 -->
            <div class="header-user">
                <span th:text="${loginEmail}"></span>

                <!-- ログアウトボタン -->
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="secondary-button">
                        ログアウト
                    </button>
                </form>
            </div>
        </header>

        <!-- ========================================
             共通サイドメニュー

             activeMenu：
             home      ホーム
             companies 企業一覧・企業詳細
             calendar  カレンダー
             ======================================== -->
        <aside class="sidebar" th:fragment="sidebar(activeMenu)">
            <nav>
                <ul class="sidebar-menu">
                    <!-- ホーム -->
                    <li>
                        <a
                            th:href="@{/}"
                            th:classappend="${activeMenu == 'home'} ? 'active' : ''"
                        >
                            ホーム
                        </a>
                    </li>

                    <!-- 企業一覧 -->
                    <li>
                        <a
                            th:href="@{/companies}"
                            th:classappend="${activeMenu == 'companies'} ? 'active' : ''"
                        >
                            企業一覧
                        </a>
                    </li>

                    <!-- カレンダー -->
                    <li>
                        <a
                            th:href="@{/calendar}"
                            th:classappend="${activeMenu == 'calendar'} ? 'active' : ''"
                        >
                            カレンダー
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>
    </body>
</html>
