<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>カレンダー | CareerTrack</title>

        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>

    <body>
        <!-- 共通ヘッダー -->
        <header th:replace="~{fragments/layout :: header}"></header>

        <!-- ==============================
         画面全体
    ============================== -->
        <div class="app-container">
            <!-- 共通サイドメニュー -->
            <aside
                th:replace="~{fragments/layout :: sidebar('calendar')}"
            ></aside>

            <!-- ==============================
             メインコンテンツ
        ============================== -->
            <main class="main-content">
                <div class="calendar-page">
                    <!-- ページタイトル -->
                    <div class="calendar-page-header">
                        <div>
                            <h1 class="page-title">カレンダー</h1>

                            <p>面談・面接や書類の予定を確認できます。</p>
                        </div>
                    </div>

                    <!-- ==============================
                     カレンダー操作
                ============================== -->
                    <section class="calendar-section">
                        <!-- ==============================
     月表示・週表示切り替え
============================== -->
                        <div class="calendar-view-switch">
                            <a
                                th:href="@{/calendar(year=${currentYear},month=${currentMonth})}"
                                class="calendar-view-button"
                                th:classappend="${view == 'month'} ? ' active' : ''"
                            >
                                月表示
                            </a>

                            <a
                                th:href="@{/calendar(view='week',date=${selectedDate})}"
                                class="calendar-view-button"
                                th:classappend="${view == 'week'} ? ' active' : ''"
                            >
                                週表示
                            </a>
                        </div>
                        <div class="calendar-toolbar">
                            <!-- 前の期間 -->
                            <a
                                th:if="${view == 'month'}"
                                th:href="@{/calendar(year=${previousYear},month=${previousMonth})}"
                                class="calendar-nav-button"
                            >
                                前月
                            </a>

                            <a
                                th:if="${view == 'week'}"
                                th:href="@{/calendar(view='week',date=${previousDate})}"
                                class="calendar-nav-button"
                            >
                                前週
                            </a>

                            <!-- 表示期間 -->
                            <h2
                                class="calendar-month-title"
                                th:text="${periodLabel}"
                            ></h2>

                            <!-- 次の期間 -->
                            <a
                                th:if="${view == 'month'}"
                                th:href="@{/calendar(year=${nextYear},month=${nextMonth})}"
                                class="calendar-nav-button"
                            >
                                翌月
                            </a>

                            <a
                                th:if="${view == 'week'}"
                                th:href="@{/calendar(view='week',date=${nextDate})}"
                                class="calendar-nav-button"
                            >
                                翌週
                            </a>
                        </div>

                        <!-- ==============================
                         予定の凡例
                    ============================== -->
                        <div class="calendar-legend">
                            <span class="calendar-legend-item">
                                <span
                                    class="event-color event-interview"
                                ></span>
                                面談・面接
                            </span>

                            <span class="calendar-legend-item">
                                <span
                                    class="event-color event-document-plan"
                                ></span>
                                書類提出予定
                            </span>

                            <span class="calendar-legend-item">
                                <span
                                    class="event-color event-document-deadline"
                                ></span>
                                書類提出期限
                            </span>
                        </div>

                        <!-- ==============================
                         カレンダー本体
                    ============================== -->
                        <div class="calendar-grid" th:if="${view == 'month'}">
                            <!-- 曜日 -->
                            <div class="calendar-weekday sunday">日</div>

                            <div class="calendar-weekday">月</div>

                            <div class="calendar-weekday">火</div>

                            <div class="calendar-weekday">水</div>

                            <div class="calendar-weekday">木</div>

                            <div class="calendar-weekday">金</div>

                            <div class="calendar-weekday saturday">土</div>

                            <!-- 日付 -->
                            <div
                                th:each="day : ${calendarDays}"
                                class="calendar-day"
                                th:classappend="${!day.currentMonth} ? ' other-month' : ''"
                            >
                                <!-- 日付番号 -->
                                <div
                                    class="calendar-day-number"
                                    th:text="${day.dayNumber}"
                                ></div>

                                <!-- 予定一覧 -->
                                <div class="calendar-events">
                                    <a
                                        th:each="event : ${day.events}"
                                        th:href="@{/companies/{companyId}(companyId=${event.companyId})}"
                                        class="calendar-event"
                                        th:classappend="${event.eventType == 'INTERVIEW'} ? ' event-interview' : (${event.eventType == 'DOCUMENT_PLAN'} ? ' event-document-plan' : ' event-document-deadline')"
                                    >
                                        <!-- 面談・面接の開始時刻 -->
                                        <span
                                            th:if="${view == 'week' and event.eventType == 'INTERVIEW'}"
                                            class="calendar-event-time"
                                            th:text="${#dates.format(event.eventDate, 'HH:mm')}"
                                        ></span>
                                        <span
                                            class="calendar-event-title"
                                            th:text="${event.title}"
                                        >
                                        </span>

                                        <span
                                            class="calendar-event-company"
                                            th:text="${event.companyName}"
                                        >
                                        </span>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- 週表示カレンダー -->
                        <div class="weekly-calendar" th:if="${view == 'week'}">
                            <!-- 曜日・日付ヘッダー -->
                            <div class="weekly-header">
                                <!-- 時間軸の空白部分 -->
                                <div class="weekly-time-header"></div>

                                <!-- 7日分の曜日と日付 -->
                                <div
                                    th:each="day, stat : ${calendarDays}"
                                    class="weekly-day-header"
                                    th:classappend="${stat.index == 0} ? ' sunday' : (${stat.index == 6} ? ' saturday' : '')"
                                >
                                    <span
                                        class="weekly-weekday"
                                        th:text="${ {'日', '月', '火', '水', '木', '金', '土'}[stat.index]}"
                                    ></span>

                                    <span
                                        class="weekly-day-number"
                                        th:text="${day.dayNumber}"
                                    ></span>
                                </div>
                            </div>

                            <!-- 終日予定欄 -->
                            <div class="weekly-all-day">
                                <div class="weekly-all-day-label">終日</div>

                                <!-- 日付ごとの書類提出予定・提出期限 -->
                                <div
                                    th:each="day : ${calendarDays}"
                                    class="weekly-all-day-cell"
                                >
                                    <a
                                        th:each="event : ${day.events}"
                                        th:if="${event.eventType != 'INTERVIEW'}"
                                        th:href="@{/companies/{companyId}(companyId=${event.companyId})}"
                                        class="weekly-all-day-event"
                                        th:classappend="${event.eventType == 'DOCUMENT_PLAN'} ? ' event-document-plan' : ' event-document-deadline'"
                                    >
                                        <span th:text="${event.title}"></span>
                                        <span
                                            class="weekly-event-company"
                                            th:text="${event.companyName}"
                                        ></span>
                                    </a>
                                </div>
                            </div>

                            <!-- 時間軸のスクロール領域 -->
                            <div class="weekly-scroll">
                                <div class="weekly-time-grid">
                                    <!-- 左側の時間軸 -->
                                    <div class="weekly-time-axis">
                                        <div
                                            th:each="hour : ${calendarHours}"
                                            class="weekly-hour-label"
                                            th:style="|top: ${(hour - startHour) * 60}px;|"
                                        >
                                            <span th:text="|${hour}:00|"></span>
                                        </div>
                                    </div>

                                    <!-- 日付ごとの時間割 -->
                                    <div
                                        th:each="day : ${calendarDays}"
                                        class="weekly-day-column"
                                    >
                                        <!-- 1時間単位の横線 -->
                                        <div
                                            th:each="hour : ${calendarHours}"
                                            class="weekly-hour-line"
                                            th:style="|top: ${(hour - startHour) * 60}px;|"
                                        ></div>

                                        <!-- 面談・面接予定 -->
                                        <a
                                            th:each="event : ${day.events}"
                                            th:if="${event.eventType == 'INTERVIEW'}"
                                            th:href="@{/companies/{companyId}(companyId=${event.companyId})}"
                                            class="weekly-timed-event event-interview"
                                            th:style="|top: ${event.startMinutes}px; height: ${event.durationMinutes}px;|"
                                            th:title="|${event.displayTime} ${event.companyName} ${event.title}|"
                                        >
                                            <span
                                                class="weekly-event-time"
                                                th:text="${event.displayTime}"
                                            ></span>

                                            <span
                                                class="weekly-event-title"
                                                th:text="${event.title}"
                                            ></span>

                                            <span
                                                class="weekly-event-company"
                                                th:text="${event.companyName}"
                                            ></span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 予定がない場合の案内 -->
                        <p
                            th:if="${#lists.isEmpty(calendarDays.?[!events.isEmpty()])}"
                            class="calendar-empty-message"
                            th:text="${view == 'week'} ? 'この週に登録されている予定はありません。' : 'この月に登録されている予定はありません。'"
                        ></p>
                    </section>

                    <!-- ページ下部 -->
                    <div class="calendar-footer">
                        <a th:href="@{/}"> ホームへ戻る </a>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
