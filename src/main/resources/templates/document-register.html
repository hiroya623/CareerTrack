<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>書類情報登録 | CareerTrack</title>
        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>

    <body>
        <main class="page-container">
            <!-- ページヘッダー -->
            <header class="page-header">
                <div>
                    <h1>書類情報登録</h1>
                    <p>企業に提出する書類の情報を管理します。</p>
                </div>

                <div class="header-actions">
                    <a
                        th:href="@{/companies/{companyId}(companyId=${companyId})}"
                        class="secondary-button"
                    >
                        企業詳細へ戻る
                    </a>
                </div>
            </header>

            <section class="form-container">
                <!-- エラーメッセージ -->
                <div
                    th:if="${errorMessage}"
                    class="error-message"
                    th:text="${errorMessage}"
                ></div>

                <!-- 書類登録フォーム -->
                <form
                    th:action="@{/companies/{companyId}/documents/register(companyId=${companyId})}"
                    th:object="${document}"
                    method="post"
                >
                    <!-- 書類名 -->
                    <div class="form-group">
                        <label for="documentName">書類名</label>

                        <input
                            type="text"
                            id="documentName"
                            th:field="*{documentName}"
                            maxlength="100"
                            placeholder="例：履歴書、職務経歴書、スキルシート"
                            required
                        />
                    </div>

                    <!-- 提出期限日 -->
                    <div class="form-group">
                        <label for="deadlineDate">提出期限日</label>

                        <input
                            type="date"
                            id="deadlineDate"
                            th:field="*{deadlineDate}"
                        />
                    </div>

                    <!-- 提出予定日 -->
                    <div class="form-group">
                        <label for="plannedSubmissionDate">提出予定日</label>

                        <input
                            type="date"
                            id="plannedSubmissionDate"
                            th:field="*{plannedSubmissionDate}"
                        />
                    </div>

                    <!-- 提出状況 -->
                    <div class="form-group">
                        <label for="submissionStatus">提出状況</label>

                        <select
                            id="submissionStatus"
                            th:field="*{submissionStatus}"
                            required
                        >
                            <option value="NOT_SUBMITTED">未提出</option>
                            <option value="SUBMITTED">提出済み</option>
                        </select>
                    </div>

                    <!-- 実際の提出日 -->
                    <div class="form-group">
                        <label for="submittedDate">実際の提出日</label>

                        <input
                            type="date"
                            id="submittedDate"
                            th:field="*{submittedDate}"
                        />
                    </div>

                    <!-- メモ -->
                    <div class="form-group">
                        <label for="memo">メモ</label>

                        <textarea
                            id="memo"
                            th:field="*{memo}"
                            rows="6"
                            maxlength="5000"
                            placeholder="提出書類に関する補足事項を入力してください。"
                        >
                        </textarea>
                    </div>

                    <!-- ファイル保存に関する説明 -->
                    <p class="form-description">
                        ※
                        現在は書類ファイル本体を保存せず、書類名や提出状況などの管理情報のみを登録します。
                    </p>

                    <!-- 操作ボタン -->
                    <div class="form-actions">
                        <button type="submit" class="primary-button">
                            書類情報を登録
                        </button>

                        <a
                            th:href="@{/companies/{companyId}(companyId=${companyId})}"
                            class="secondary-button"
                        >
                            キャンセル
                        </a>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
