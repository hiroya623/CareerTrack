<!DOCTYPE html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業情報編集 | CareerTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <main class="page-container">

        <header class="page-header">
            <div>
                <h1>企業情報編集</h1>
                <p>登録済みの企業情報を編集します。</p>
            </div>
        </header>

        <section class="form-container">

            <!-- 更新時のエラーメッセージ -->
            <div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}">
            </div>

            <form th:action="@{/companies/{companyId}/edit(companyId=${companyId})}" th:object="${company}"
                method="post">

                <!-- 企業名 -->
                <div class="form-group">
                    <label for="companyName">
                        企業名 <span class="required-label">必須</span>
                    </label>
                    <input type="text" id="companyName" th:field="*{companyName}" maxlength="100" required>
                </div>

                <!-- 企業URL -->
                <div class="form-group">
                    <label for="companyUrl">企業URL</label>
                    <input type="url" id="companyUrl" th:field="*{companyUrl}" maxlength="2048"
                        placeholder="https://example.com">
                </div>

                <!-- 所在地 -->
                <div class="form-group">
                    <label for="location">所在地</label>
                    <input type="text" id="location" th:field="*{location}" maxlength="100" placeholder="福岡県福岡市">
                </div>

                <!-- 企業概要 -->
                <div class="form-group">
                    <label for="overview">企業概要</label>
                    <textarea id="overview" th:field="*{overview}" maxlength="1000" rows="5"></textarea>
                </div>

                <!-- メモ -->
                <div class="form-group">
                    <label for="memo">メモ</label>
                    <textarea id="memo" th:field="*{memo}" maxlength="5000" rows="8"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="primary-button">
                        更新する
                    </button>

                    <a th:href="@{/companies/{companyId}(companyId=${companyId})}" class="secondary-button">
                        キャンセル
                    </a>
                </div>

            </form>

        </section>

        <footer class="page-footer">
            <a th:href="@{/companies}">企業一覧へ戻る</a>
        </footer>

    </main>

</body>

</html>
