<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>面談・面接情報登録 | CareerTrack</title>
        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>

    <body>
        <main class="page-container">
            <!-- ページヘッダー -->
            <header class="page-header">
                <div>
                    <h1>面談・面接情報登録</h1>
                    <p>企業との面談・面接の予定や接続情報を管理します。</p>
                </div>

                <div class="header-actions">
                    <a
                        th:href="@{/companies/{companyId}(companyId=${companyId})}"
                        class="secondary-button"
                    >
                        企業詳細へ戻る
                    </a>
                </div>
            </header>

            <section class="form-container">
                <!-- エラーメッセージ -->
                <div
                    th:if="${errorMessage}"
                    class="error-message"
                    th:text="${errorMessage}"
                ></div>

                <!-- 面談・面接登録フォーム -->
                <form
                    th:action="@{/companies/{companyId}/interviews/register(companyId=${companyId})}"
                    th:object="${interview}"
                    method="post"
                >
                    <!-- 面談・面接名 -->
                    <div class="form-group">
                        <label for="interviewName">面談・面接名</label>

                        <select
                            id="interviewName"
                            th:field="*{interviewName}"
                            required
                        >
                            <option value="">選択してください</option>
                            <option value="カジュアル面談">
                                カジュアル面談
                            </option>
                            <option value="1次面接">1次面接</option>
                            <option value="2次面接">2次面接</option>
                            <option value="3次面接">3次面接</option>
                            <option value="最終面接">最終面接</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>

                    <!-- 実施日時 -->
                    <div class="form-group">
                        <label for="interviewDateTime">実施日時</label>

                        <input
                            type="datetime-local"
                            id="interviewDateTime"
                            th:field="*{interviewDateTime}"
                            required
                        />
                    </div>

                    <!-- 実施形式 -->
                    <div class="form-group">
                        <label for="interviewFormat">実施形式</label>

                        <select
                            id="interviewFormat"
                            th:field="*{interviewFormat}"
                            required
                        >
                            <option value="">選択してください</option>
                            <option value="ONSITE">対面</option>
                            <option value="ONLINE">オンライン</option>
                        </select>
                    </div>

                    <!-- 実施場所 -->
                    <div class="form-group">
                        <label for="location">実施場所</label>

                        <input
                            type="text"
                            id="location"
                            th:field="*{location}"
                            maxlength="255"
                            placeholder="例：福岡県福岡市〇〇区〇〇"
                        />
                    </div>

                    <!-- オンラインURL -->
                    <div class="form-group">
                        <label for="onlineUrl">オンラインURL</label>

                        <input
                            type="url"
                            id="onlineUrl"
                            th:field="*{onlineUrl}"
                            maxlength="2000"
                            placeholder="例：https://meet.google.com/xxx-xxxx-xxx"
                        />
                    </div>

                    <!-- アクセス情報 -->
                    <div class="form-group">
                        <label for="accessInfo">アクセス情報</label>

                        <textarea
                            id="accessInfo"
                            th:field="*{accessInfo}"
                            rows="4"
                            maxlength="2000"
                            placeholder="会議ID、パスコード、入室方法などを入力してください。"
                        ></textarea>
                    </div>

                    <!-- メモ -->
                    <div class="form-group">
                        <label for="memo">メモ</label>

                        <textarea
                            id="memo"
                            th:field="*{memo}"
                            rows="6"
                            maxlength="5000"
                            placeholder="面談・面接に関する補足事項や準備内容を入力してください。"
                        ></textarea>
                    </div>

                    <!-- 説明 -->
                    <p class="form-description">
                        ※
                        既存の面談・面接予定の前後1時間以内には、新しい予定を登録できません。
                    </p>

                    <!-- 操作ボタン -->
                    <div class="form-actions">
                        <button type="submit" class="primary-button">
                            面談・面接情報を登録
                        </button>

                        <a
                            th:href="@{/companies/{companyId}(companyId=${companyId})}"
                            class="secondary-button"
                        >
                            キャンセル
                        </a>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
