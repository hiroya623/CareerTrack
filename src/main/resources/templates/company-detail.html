<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>企業詳細 | CareerTrack</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

    <div class="page-container">

        <!-- ページヘッダー -->
        <header class="page-header">

            <div>
                <h1>企業詳細</h1>
                <p>登録した企業の基本情報を確認できます。</p>
            </div>

            <div class="header-actions">

                <a th:href="@{/companies}" class="secondary-button">
                    企業一覧へ戻る
                </a>

            </div>

        </header>

        <!-- 企業名 -->
        <section class="company-detail-card">

            <div class="company-detail-header">

                <h2 th:text="${company.companyName}">
                    企業名
                </h2>

                <span class="detail-label">
                    企業情報
                </span>

                <div class="header-actions">

                    <!-- 編集画面へのリンク -->
                    <a th:href="@{/companies/{companyId}/edit(companyId=${companyId})}" class="primary-button">
                        企業情報を編集
                    </a>

                    <!-- 企業情報削除フォーム -->
                    <form th:action="@{/companies/{companyId}/delete(companyId=${companyId})}" method="post"
                        onsubmit="return confirm('この企業情報を削除してもよろしいですか？');">

                        <button type="submit" class="secondary-button">
                            企業情報を削除
                        </button>

                    </form>

                </div>

            </div>

            <!-- 基本情報 -->
            <div class="company-detail-body">

                <div class="detail-item">

                    <h3>企業名</h3>

                    <p th:text="${company.companyName}">
                        企業名
                    </p>

                </div>

                <div class="detail-item">

                    <h3>企業公式サイト</h3>

                    <p th:if="${company.companyUrl != null
                              and !#strings.isEmpty(company.companyUrl)}">

                        <a th:href="${company.companyUrl}" target="_blank" rel="noopener noreferrer"
                            th:text="${company.companyUrl}">
                            公式サイトURL
                        </a>

                    </p>

                    <p th:if="${company.companyUrl == null
                              or #strings.isEmpty(company.companyUrl)}">
                        未登録
                    </p>

                </div>

                <div class="detail-item">

                    <h3>所在地</h3>

                    <p th:if="${company.location != null
                              and !#strings.isEmpty(company.location)}" th:text="${company.location}">
                        所在地
                    </p>

                    <p th:if="${company.location == null
                              or #strings.isEmpty(company.location)}">
                        未登録
                    </p>

                </div>

                <div class="detail-item">

                    <h3>企業概要・事業内容</h3>

                    <p class="detail-text" th:if="${company.overview != null
                              and !#strings.isEmpty(company.overview)}" th:text="${company.overview}">
                        企業概要
                    </p>

                    <p th:if="${company.overview == null
                              or #strings.isEmpty(company.overview)}">
                        未登録
                    </p>

                </div>

                <div class="detail-item">

                    <h3>自分用メモ</h3>

                    <p class="detail-text" th:if="${company.memo != null
                              and !#strings.isEmpty(company.memo)}" th:text="${company.memo}">
                        自分用メモ
                    </p>

                    <p th:if="${company.memo == null
                              or #strings.isEmpty(company.memo)}">
                        未登録
                    </p>

                </div>

                <div class="detail-item">

                    <h3>登録日時</h3>

                    <p th:if="${company.createdAt != null}" th:text="${#dates.format(
                           company.createdAt,
                           'yyyy/MM/dd HH:mm')}">
                        登録日時
                    </p>

                </div>

                <div class="detail-item">

                    <h3>最終更新日時</h3>

                    <p th:if="${company.updatedAt != null}" th:text="${#dates.format(
                           company.updatedAt,
                           'yyyy/MM/dd HH:mm')}">
                        最終更新日時
                    </p>

                </div>

            </div>

        </section>

        <!-- 今後の機能追加予定エリア -->
        <section class="company-related-section">

            <h2>関連情報</h2>

            <p>
                今後、この企業に紐付く応募情報・提出書類・面接情報などを
                ここから管理できるようにします。
            </p>

        </section>

        <!-- ページ下部 -->
        <footer class="page-footer">

            <a th:href="@{/companies}">
                企業一覧へ戻る
            </a>

        </footer>

    </div>

</body>

</html>
